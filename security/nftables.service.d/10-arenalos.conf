# /etc/systemd/system/nftables.service.d/10-arenalos.conf
# ArenalOS · Tema 9 (Protección y seguridad) · Responsable: Esteban
#
# El nftables.service de Arch es Type=oneshot SIN RemainAfterExit: carga las
# reglas y queda "inactive (dead)", aunque el firewall SÍ esté activo en el
# kernel. Eso hace que "systemctl is-active nftables" mienta.
# Este drop-in hace que el estado del servicio refleje el del firewall:
#   systemctl status nftables   -> active (exited) mientras haya reglas
#   systemctl reload nftables   -> vuelve a cargar /etc/nftables.conf
#   systemctl stop nftables     -> borra las reglas (firewall apagado)

[Service]
RemainAfterExit=yes
ExecReload=/usr/bin/nft -f /etc/nftables.conf
ExecStop=/usr/bin/nft flush ruleset
