#!/usr/bin/nft -f
# /etc/nftables.conf
# ArenalOS · Tema 9 (Protección y seguridad) · Responsable: Esteban
#
# Firewall con política de DENEGACIÓN POR DEFECTO en la entrada: todo lo que no
# esté explícitamente permitido se descarta (policy drop).
# Validar sin aplicar:  nft -c -f /etc/nftables.conf
# Ver reglas y contadores:  nft list ruleset
# Referencia: nft(8); Arch Wiki "nftables"; wiki.nftables.org "Simple ruleset for a server".

flush ruleset

# Puertos TCP permitidos desde la red. Para abrir otro puerto, agréguelo aquí
# (p. ej. { 22, 8080 }) y ejecute: sudo nft -f /etc/nftables.conf
#   22 = SSH (endurecido en sshd_config.d/10-arenalos.conf)
define PUERTOS_TCP = { 22 }

table inet arenalos {             # "inet" = una sola tabla para IPv4 e IPv6

    chain input {
        type filter hook input priority filter; policy drop;

        # Paquetes que no pertenecen a ninguna conexión válida
        ct state invalid counter drop comment "invalidos"

        # Respuestas a conexiones que esta máquina inició (DNS, pacman, ping...)
        ct state { established, related } counter accept comment "conexiones-establecidas"

        # Tráfico local (loopback)
        iif "lo" accept comment "loopback"

        # Ping limitado y el ICMPv6 que IPv6 necesita para funcionar (vecinos, router)
        ip protocol icmp icmp type echo-request limit rate 5/second counter accept comment "ping"
        meta l4proto ipv6-icmp counter accept comment "icmpv6"

        # Servicios permitidos; conexiones nuevas limitadas contra fuerza bruta
        tcp dport $PUERTOS_TCP ct state new limit rate 30/minute burst 30 packets counter accept comment "servicios-permitidos"

        # Todo lo demás cae en la política drop. Se registra una muestra limitada
        # (journalctl -k --grep arenalos-drop) y se cuenta.
        limit rate 10/minute burst 5 packets log prefix "arenalos-drop: " level info
        counter comment "descartados-por-politica"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;   # no es un router
    }

    chain output {
        type filter hook output priority filter; policy accept;  # la VM puede salir
    }
}
