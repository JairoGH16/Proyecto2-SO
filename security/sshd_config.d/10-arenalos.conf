# /etc/ssh/sshd_config.d/10-arenalos.conf
# ArenalOS · Tema 9 (Protección y seguridad) · Responsable: Esteban
#
# Endurecimiento de SSH. En sshd gana el PRIMER valor leído y los archivos de
# sshd_config.d se leen en orden alfabético: por eso este archivo empieza con
# "10-", para tener prioridad sobre 99-archlinux.conf.
# Validar:  sshd -t        Ver valores efectivos:  sshd -T
# Referencia: sshd_config(5); Arch Wiki "OpenSSH#Protection".

# Nadie entra directamente como root; se entra como usuario y se usa sudo.
PermitRootLogin no

# Solo llaves públicas: sin contraseñas (inmune a fuerza bruta de contraseñas).
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Solo los miembros del grupo arenalos-ssh pueden entrar (lista blanca).
AllowGroups arenalos-ssh

# Menos oportunidades a un atacante por conexión.
MaxAuthTries 3
LoginGraceTime 30

# Sin reenvíos que no se usan (reducen la superficie de ataque).
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Cierra sesiones muertas (2 x 300 s sin respuesta).
ClientAliveInterval 300
ClientAliveCountMax 2

# Registra la huella de la llave usada en cada inicio de sesión.
LogLevel VERBOSE
