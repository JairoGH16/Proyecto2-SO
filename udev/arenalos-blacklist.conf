# /etc/modprobe.d/arenalos-blacklist.conf
# ArenalOS · Tema 8 (E/S y dispositivos) · Responsable: Esteban
#
# Lista negra de módulos del kernel que se cargan en la VM (VirtualBox) pero
# controlan hardware que la VM NO tiene. Cada entrada se justificó con evidencia
# medida en la VM (ver docs/tema-08-es-dispositivos.md).
#
# Diferencia clave:
#   blacklist <mod>        -> impide la carga AUTOMÁTICA por alias (udev/modalias),
#                             pero el módulo se puede cargar si otro depende de él
#                             o si alguien ejecuta "modprobe <mod>".
#   install <mod> /bin/false -> cualquier intento de cargarlo (incluso como
#                             dependencia) ejecuta /bin/false y falla.
# Referencia: modprobe.d(5); Arch Wiki "Kernel module#Blacklisting".

# 1) pcspkr: driver del parlante interno de la placa ("beep").
#    La VM no tiene parlante; solo genera pitidos (p. ej. al completar con Tab).
blacklist pcspkr

# 2) intel_rapl_msr / intel_rapl_common: medición y límite de energía (RAPL) vía MSR.
#    En la VM se cargan por el modelo de CPU del host, pero /sys/class/powercap/
#    queda VACÍO: el hipervisor no expone los MSR de energía, así que no hacen nada.
blacklist intel_rapl_msr
blacklist intel_rapl_common

# 3) intel_pmc_core (+ telemetría PMT/VSEC): controlador del Power Management
#    Controller de chipsets Intel físicos. En la VM no registra nada en dmesg ni
#    crea /sys/kernel/debug/pmc_core: el PMC no existe.
blacklist intel_pmc_core
blacklist intel_pmc_ssram_telemetry
blacklist pmt_telemetry

# 4) vmw_vmci: canal VM<->host de VMware (requiere el dispositivo PCI 15ad:0740).
#    El hipervisor es VirtualBox y ese dispositivo no aparece en lspci.
#    Cuando systemd abre un socket AF_VSOCK (familia 40), el kernel pide el alias
#    "net-pf-40" = vmw_vsock_vmci_transport. modprobe carga PRIMERO sus dependencias
#    (vsock, vmw_vmci) y DESPUÉS ejecuta el "install" del módulo pedido, así que
#    bloquear solo el transporte no basta: vmw_vmci entra como dependencia y
#    "blacklist" no aplica a dependencias. Se bloquean los dos con "install".
#    Comprobación: modprobe -n -v net-pf-40   (simulación, no carga nada)
blacklist vmw_vmci
install vmw_vmci /bin/false
install vmw_vsock_vmci_transport /bin/false
